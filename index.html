<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Кликер</h1>

        <div class="score" id="score">0</div>

        <button class="click-btn" id="click-btn">Кликнуть</button>

        <div class="stats">
            Кликов: <span id="clicks">0</span><br>
            Сила клика: <span id="power">1</span>
        </div>

        <button class="upgrade-btn" id="upgrade-btn" disabled>
            Улучшение (10 очков)
        </button>

        <div class="achievement" id="achievement">Ты в деле!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
